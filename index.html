<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: 'sha256-HfFwx3DmniEJDqmi7kv2Fn3z17EGrAjNQXXLINvBrqw=' https://registry.npmmirror.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://registry.npmmirror.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://registry.npmmirror.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GLM">
<meta name="application-name" content="GLM">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>GLM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="boot.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="对话列表">
    <div class="side-head">
      <div class="side-brand"><span class="brand-mark"></span><span>GLM</span></div>
      <button class="icon-btn" id="side-close" aria-label="收起侧栏"></button>
    </div>
    <button class="side-new" id="side-new"><span class="ic-new"></span><span>新对话</span></button>
    <label class="side-search">
      <span class="ic-search"></span>
      <input id="side-q" type="search" placeholder="搜索对话" autocomplete="off" enterkeyhint="search">
    </label>
    <nav id="conv-list"></nav>
    <div class="side-foot">
      <button class="side-settings" id="side-settings"><span class="avatar" id="side-avatar">G</span><span class="side-user" id="side-user">设置</span><span class="ic-gear"></span></button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="btn-side" aria-label="打开侧栏"></button>
      <button id="title-btn"><span id="title-text">新对话</span><span class="ic-chev"></span></button>
      <button class="icon-btn" id="btn-new" aria-label="新对话"></button>
    </header>

    <div id="scroller">
      <div id="banner"></div>
      <div id="thread"></div>
    </div>
    <button id="jump" aria-label="回到底部"></button>

    <footer id="composer">
      <div class="comp-box" id="comp-box">
        <div id="atts"></div>
        <textarea id="input" rows="1" placeholder="今天有什么可以帮你？" enterkeyhint="enter" autocomplete="off" autocapitalize="sentences"></textarea>
        <div class="comp-bar">
          <button class="tool-btn" id="btn-attach" aria-label="添加图片或文件"></button>
          <button class="chip" id="chip-code" aria-pressed="false"></button>
          <button class="chip" id="chip-search" aria-pressed="false"></button>
          <button class="chip" id="chip-effort"></button>
          <span class="flex"></span>
          <button class="send" id="btn-send" aria-label="发送" disabled></button>
        </div>
      </div>
      <input type="file" id="file-in" multiple hidden accept="image/*,video/*,application/pdf,text/*,.txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.xml,.yaml,.yml,.toml,.ini,.log,.py,.js,.mjs,.ts,.tsx,.jsx,.java,.kt,.c,.h,.cpp,.hpp,.cc,.cs,.go,.rs,.rb,.php,.swift,.m,.sh,.bat,.ps1,.sql,.html,.htm,.css,.scss,.vue,.tex,.r,.lua,.dart,.docx,.xlsx,.pptx">
    </footer>
  </main>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
